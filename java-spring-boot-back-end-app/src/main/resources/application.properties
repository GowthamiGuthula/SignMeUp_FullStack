spring.application.name=api
spring.datasource.url=jdbc:mysql://localhost:3306/signmeup
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload-dir=uploads

# Free access key from https://unsplash.com/developers - leave blank to use the
# built-in category fallback images instead of live Unsplash search results.
unsplash.access-key=${UNSPLASH_ACCESS_KEY:}